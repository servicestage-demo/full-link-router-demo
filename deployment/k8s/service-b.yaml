apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  labels:
    app: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
        sermant-injection: enabled
    spec:
      containers:
        - name: service-b
          image: service-b:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: "SERVICE_META_PARAMETERS"
              value: "group:base"
            - name: "NACOS_ADDRESS"
              value: "127.0.0.1:8848"
      imagePullSecrets:
        - name: default-secret